<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מצלמה + שכבת תמונה</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#000;
    font-family: Arial;
    overflow:hidden;
    user-select:none;
  }

  #viewport {
    position:relative;
    width:100vw;
    height:100vh;
    touch-action:none;
  }

  video {
    width:100%;
    height:100%;
    object-fit:cover;
  }

  #overlay-img {
    position:absolute;
    top:0;
    left:0;
    opacity:0.5;
    display:none;
    transform-origin:center;
    touch-action:none;
  }

  #controls {
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    padding:10px;
    color:white;
  }

  button {
    padding:10px;
    margin:5px;
  }

  input[type="range"]{
    width:100%;
  }
</style>
</head>

<body>

<div id="viewport">
  <video id="video" autoplay playsinline></video>
  <img id="overlay-img">
</div>

<div id="controls">
  <button onclick="startCamera()">הפעל מצלמה</button>
  <button onclick="document.getElementById('file').click()">טען תמונה</button>

  <input type="file" id="file" hidden onchange="loadImage(event)">

  <!-- שקיפות -->
  <input type="range" min="0" max="100" value="50" oninput="setOpacity(this.value)">
</div>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay-img");
const vp = document.getElementById("viewport");

let stream = null;
let imgLoaded = false;

// image state
let natW = 300, natH = 300;
let imgCX = 200, imgCY = 200;
let imgScale = 1;

// opacity
let opacity = 0.5;

// pointer state
const pointerCache = new Map();

let dragging = false;
let dragId = null;
let dragStartX, dragStartY, startCX, startCY;

let pinching = false;
let pinchIds = [];
let pinchStartDist = 0;
let pinchStartScale = 1;

function applyTransform() {
  const w = natW * imgScale;
  const h = natH * imgScale;

  overlay.style.width = w + "px";
  overlay.style.height = h + "px";
  overlay.style.left = (imgCX - w/2) + "px";
  overlay.style.top = (imgCY - h/2) + "px";

  overlay.style.opacity = opacity;
}

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
}

// load image
function loadImage(e) {
  const file = e.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    natW = img.naturalWidth;
    natH = img.naturalHeight;

    imgScale = 0.5;
    imgCX = window.innerWidth/2;
    imgCY = window.innerHeight/2;

    overlay.src = url;
    overlay.style.display = "block";

    imgLoaded = true;
    applyTransform();
  };

  img.src = url;
  e.target.value = "";
}

// opacity control
function setOpacity(v) {
  opacity = v / 100;
  overlay.style.opacity = opacity;
}

// POINTER SYSTEM
vp.addEventListener("pointerdown", e => {
  if (!imgLoaded) return;

  pointerCache.set(e.pointerId, e);

  if (pointerCache.size === 1) {
    dragging = true;
    dragId = e.pointerId;

    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startCX = imgCX;
    startCY = imgCY;

    vp.setPointerCapture(e.pointerId);
  }

  if (pointerCache.size === 2) {
    pinching = true;
    dragging = false;

    const pts = [...pointerCache.values()];
    const [p1, p2] = pts;

    pinchIds = [p1.pointerId, p2.pointerId];
    pinchStartDist = Math.hypot(
      p1.clientX - p2.clientX,
      p1.clientY - p2.clientY
    );
    pinchStartScale = imgScale;
  }
});

vp.addEventListener("pointermove", e => {
  pointerCache.set(e.pointerId, e);

  // PINCH
  if (pinching) {
    const p1 = pointerCache.get(pinchIds[0]);
    const p2 = pointerCache.get(pinchIds[1]);
    if (!p1 || !p2) return;

    const dist = Math.hypot(
      p1.clientX - p2.clientX,
      p1.clientY - p2.clientY
    );

    imgScale = Math.max(0.05, Math.min(4,
      pinchStartScale * dist / pinchStartDist
    ));

    applyTransform();
    return;
  }

  // DRAG
  if (dragging && e.pointerId === dragId && pointerCache.size === 1) {
    imgCX = startCX + (e.clientX - dragStartX);
    imgCY = startCY + (e.clientY - dragStartY);
    applyTransform();
  }
});

vp.addEventListener("pointerup", e => {
  pointerCache.delete(e.pointerId);

  if (e.pointerId === dragId) dragging = false;

  if (pointerCache.size < 2) pinching = false;
});

vp.addEventListener("pointercancel", () => {
  pointerCache.clear();
  dragging = false;
  pinching = false;
});
</script>

</body>
</html>
